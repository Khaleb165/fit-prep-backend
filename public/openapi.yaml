openapi: 3.0.0
info:
  title: Fit Prep API
  description: API documentation for the Fit Prep backend
  version: 1.0.0
servers:
  - url: https://fit-prep-backend.onrender.com
paths:
  /auth/login:
    post:
      summary: Login a user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
        "409":
          description: Username or email already exists
  /auth/me:
    get:
      summary: Get current authenticated user
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
  /plans:
    get:
      summary: Fetch workout plans
      tags:
        - Plans
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workout plans for the authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
        "401":
          description: Unauthorized
    post:
      summary: Create a workout plan
      tags:
        - Plans
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "201":
          description: Plan created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
  /plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Fetch a workout plan
      tags:
        - Plans
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workout plan details
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: "#/components/schemas/Plan"
        "401":
          description: Unauthorized
        "404":
          description: Plan not found
    patch:
      summary: Update a workout plan title
      tags:
        - Plans
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "200":
          description: Plan updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Plan not found
    delete:
      summary: Delete a workout plan
      tags:
        - Plans
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Plan deleted successfully
        "401":
          description: Unauthorized
        "404":
          description: Plan not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: caleb
        password:
          type: string
          format: password
          example: secret1
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: caleb
        email:
          type: string
          format: email
          example: caleb@example.com
        password:
          type: string
          format: password
          example: secret1
        name:
          type: string
          example: Caleb
        timezone:
          type: string
          example: Africa/Accra
    AuthResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 1800
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        name:
          type: string
          nullable: true
        timezone:
          type: string
        created_at:
          type: string
          format: date-time
    PlanRequest:
      type: object
      required:
        - title
        - items
        - gym_session
        - packing_time
        - reminder
      properties:
        title:
          type: string
          example: Morning Workout Plan
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"
        gym_session:
          type: string
          enum:
            - morning
            - afternoon
            - evening
          example: morning
        packing_time:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
          example: "07:30"
        reminder:
          type: string
          enum:
            - on_time
            - one_hour_before
          example: one_hour_before
    PlanResponse:
      type: object
      properties:
        message:
          type: string
        plan:
          $ref: "#/components/schemas/Plan"
    PlanItem:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          example: item-1
        title:
          type: string
          example: Water bottle
        is_checked:
          type: boolean
          example: false
    Plan:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        title:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"
        gym_session:
          type: string
          enum:
            - morning
            - afternoon
            - evening
        packing_time:
          type: string
          example: "07:30"
        reminder:
          type: string
          enum:
            - on_time
            - one_hour_before
        reminder_time:
          type: string
          readOnly: true
          description: Effective local reminder time derived from packing_time and reminder.
          example: "06:30"
        created_at:
          type: string
          format: date-time
